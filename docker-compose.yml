services:
  postgres:
    image: postgres:15-alpine
    container_name: esim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esim
      POSTGRES_PASSWORD: esim_dev_pass
      POSTGRES_DB: esim_sites
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esim -d esim_sites"]
      interval: 5s
      timeout: 5s
      retries: 5

  germany:
    build:
      context: .
      dockerfile: sites/germany/Dockerfile.dev
    container_name: esim_germany
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - ./sites/germany:/app/sites/germany
      - ./packages:/app/packages
      - /app/sites/germany/node_modules
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://esim:esim_dev_pass@postgres:5432/esim_sites
      PUBLIC_COUNTRY_CODE: DE
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NEXT_PUBLIC_POLOSIM_BUY_URL: https://www.polosim.com/de/cart
    env_file:
      - sites/germany/.env.local
    command: sh -c "npx prisma migrate deploy && npx tsx ../../packages/db/prisma/seed.ts 2>/dev/null || true && npm run dev"

  azerbaijan:
